<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16151d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Manhwa">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Manhwa Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,600;0,700;0,800;1,800&family=Manrope:wght@400;500;600;700&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
body{margin:0;padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: barre de navigation collante, rangée "Continuer", filtres, grille de couvertures; fiche en panneau modal. Look sombre violet façon Asura. */
:root{
  --bg:#16151d; --bg2:#1d1c26; --panel:#222131; --panel2:#2b2a3c; --line:#33324a;
  --fg:#ececf3; --muted:#9d9cb3; --dim:#6f6e88;
  --accent:#913fe2; --accent2:#b07af5; --accent-soft:rgba(145,63,226,.16);
  --hua:#f08a3c; --ok:#3ccf8e; --warn:#f2b84b; --bad:#ef5f6b; --star:#ffc93c;
  --f-display:"Exo 2",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Manrope",ui-sans-serif,system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:1240px;margin:0 auto}

/* nav */
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(22,21,29,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav .inner{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:800;font-style:italic;font-size:1.25rem;letter-spacing:.02em;text-transform:uppercase}
.logo i{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#5b1fa3);display:grid;place-items:center;font-style:normal;font-size:.95rem;box-shadow:0 0 18px rgba(145,63,226,.45)}
.logo span{color:var(--accent2)}
.tabs{display:flex;gap:4px;background:var(--panel);padding:4px;border-radius:10px}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:7px;font-weight:600;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--accent);color:#fff}
.tabs b{font-weight:700;margin-left:4px;opacity:.85}
.search{margin-left:auto;flex:1 1 220px;max-width:340px;position:relative}
.search input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px 9px 34px;color:var(--fg);font:inherit}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--dim)}

main{padding-block:22px 60px}
h2{font-family:var(--f-display);font-weight:700;font-size:1.15rem;margin:0;display:flex;align-items:center;gap:10px}
h2::before{content:"";width:4px;height:18px;border-radius:2px;background:var(--accent)}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.muted{color:var(--muted)}

/* continue row */
#continue{margin-bottom:28px}
.rail{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory}
.rcard{flex:0 0 280px;scroll-snap-align:start;display:flex;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left}
.rcard img,.rcard .ph{width:62px;height:88px;border-radius:7px;object-fit:cover;flex:none;background:var(--panel2)}
.rcard .rt{font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rcard .rb{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.go{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;border-radius:7px;padding:5px 10px;font-weight:700;font-size:.8rem;text-decoration:none;align-self:flex-start}
.go:hover{background:var(--accent2)}
.bar{height:4px;border-radius:2px;background:var(--panel2);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}

/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select{background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:7px 10px;font:inherit;font-weight:600}
.count{color:var(--muted);font-size:.85rem}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px 14px}
.card{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0}
.cov{position:relative;aspect-ratio:200/284;max-width:100%;border-radius:10px;overflow:hidden;background:var(--panel)}
.cov img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s ease}
.card:hover .cov img{transform:scale(1.05)}
.ph{display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.6rem;color:var(--dim);width:100%;height:100%}
.badge{position:absolute;top:8px;left:8px;font-size:.66rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:5px;background:var(--accent);color:#fff}
.badge.hua{background:var(--hua)}
.mine{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;background:rgba(22,21,29,.85);display:grid;place-items:center;color:var(--accent2)}
.cov .foot{position:absolute;inset:auto 0 0 0;padding:20px 8px 7px;background:linear-gradient(transparent,rgba(10,9,16,.92));display:flex;justify-content:space-between;align-items:center;font-size:.75rem;font-weight:700}
.dot{display:inline-flex;align-items:center;gap:5px}
.dot::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--dim)}
.dot.ongoing::before{background:var(--ok)} .dot.completed::before{background:var(--accent2)}
.dot.hiatus::before{background:var(--warn)} .dot.dropped::before,.dot.axed::before,.dot.cancelled::before{background:var(--bad)}
.ct{font-weight:700;font-size:.9rem;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:.76rem;color:var(--muted);gap:6px}
.stars{color:var(--star);letter-spacing:1px;font-size:.78rem;white-space:nowrap}
.stars s{text-decoration:none;color:var(--dim)}
.qnote{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accent-soft);border:1px solid rgba(145,63,226,.4);border-radius:10px;padding:8px 12px;margin-bottom:14px;font-size:.85rem}
.qnote button{border:0;background:var(--accent);color:#fff;border-radius:7px;padding:4px 10px;font-weight:700;font-size:.8rem}
.empty{grid-column:1/-1;padding:50px 20px;text-align:center;color:var(--muted);background:var(--panel);border-radius:12px;border:1px dashed var(--line)}
#more{height:1px}

/* modal */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(8,7,14,.72);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
.sheet{width:100%;max-width:860px;background:var(--bg2);border:1px solid var(--line);border-radius:16px;overflow:hidden;position:relative}
.hero{position:relative;padding:22px;display:flex;gap:22px;flex-wrap:wrap}
.hero .bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(28px) brightness(.35);transform:scale(1.2)}
.hero > *:not(.bg){position:relative}
.hero .big{width:180px;max-width:42vw;aspect-ratio:200/284;border-radius:12px;overflow:hidden;background:var(--panel);flex:none;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.hero .big img{width:100%;height:100%;object-fit:cover}
.info{flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:10px}
.info h3{font-family:var(--f-display);font-weight:800;font-size:clamp(1.3rem,3.5vw,1.8rem);margin:0;line-height:1.15;text-wrap:balance}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:.74rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--panel2);color:var(--muted)}
.tag.t{background:var(--accent-soft);color:var(--accent2)}
.tag.t.hua{background:rgba(240,138,60,.15);color:var(--hua)}
.srcs{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.src{display:flex;align-items:center;gap:10px;background:rgba(34,33,49,.85);border:1px solid var(--line);border-radius:10px;padding:9px 12px;flex-wrap:wrap}
.src strong{min-width:64px}
.src .grow{flex:1;display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:.85rem}
.ghost{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--accent);color:var(--accent2);border-radius:7px;padding:5px 10px;font-weight:700;font-size:.8rem;text-decoration:none}
.ghost:hover{background:var(--accent-soft)}
.close{position:absolute;top:12px;right:12px;z-index:3;width:34px;height:34px;border-radius:50%;border:0;background:rgba(22,21,29,.8);font-size:1.2rem;line-height:1}
.track{padding:20px 22px 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;border-top:1px solid var(--line)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.box label,.lbl{font-size:.72rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font-size:1.1rem;font-weight:700}
.stepper input{width:90px;text-align:center;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;color:var(--fg);font:inherit;font-weight:700;font-size:1.05rem;font-variant-numeric:tabular-nums}
.of{color:var(--muted);font-variant-numeric:tabular-nums}
.rate{display:flex;gap:2px;align-items:center}
.rate button{border:0;background:none;font-size:1.65rem;line-height:1;color:var(--dim);padding:0 2px;position:relative}
.rate button.on{color:var(--star)}
.rate button.half{background:linear-gradient(90deg,var(--star) 50%,var(--dim) 50%);-webkit-background-clip:text;background-clip:text;color:transparent}
.rate .val{margin-left:8px;font-weight:800;font-family:var(--f-display);font-variant-numeric:tabular-nums}
.box select{background:var(--bg);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px;font:inherit;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.link-btn{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:.8rem;padding:0}
.save{font-size:.78rem;color:var(--muted);min-height:1.2em}
.backup{margin-top:40px;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--panel);display:flex;flex-direction:column;gap:10px}
.backup > div:first-child{display:flex;flex-direction:column;gap:4px;font-size:.85rem}
label.btn{display:inline-flex;align-items:center;cursor:pointer}
.note{font-size:.8rem;color:var(--muted);padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:18px}
.add{background:linear-gradient(135deg,rgba(145,63,226,.22),rgba(34,33,49,.9) 60%);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:26px;display:flex;flex-direction:column;gap:12px}
.add form{display:flex;gap:8px;flex-wrap:wrap}
.add input[type=url]{flex:1 1 260px;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--fg);font:inherit}
.btn{border:0;background:var(--accent);color:#fff;border-radius:10px;padding:10px 16px;font-weight:700}
.btn:hover{background:var(--accent2)}
.btn.sec{background:var(--panel2);color:var(--fg)}
.add .msg{font-size:.85rem;color:var(--muted);min-height:1.2em}
.add .msg.err{color:var(--bad)}
.newf{display:grid;grid-template-columns:110px 1fr;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.newf .pv{aspect-ratio:200/284;border-radius:8px;overflow:hidden;background:var(--panel2);display:grid;place-items:center;color:var(--dim);font-size:.75rem;text-align:center;cursor:pointer;position:relative;padding:8px}
.newf .pv img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.newf .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;min-width:0}
.newf .fields label{display:flex;flex-direction:column;gap:4px;font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.newf input,.newf select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;color:var(--fg);font:inherit;text-transform:none;letter-spacing:0;font-weight:600}
.newf .wide{grid-column:1/-1}
.newf .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.mini{width:80px;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:5px 7px;color:var(--fg);font:inherit;font-weight:700}
@media (max-width:480px){.newf{grid-template-columns:1fr}.newf .pv{width:120px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:560px){.grid{grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:14px 10px}.search{max-width:none;order:3;flex-basis:100%}}
</style>
</head>
<body>

<nav class="gut"><div class="inner">
  <div class="logo"><i>M</i>Manhwa<span>Tracker</span></div>
  <div class="tabs" role="group" aria-label="Vue">
    <button id="tab-all" aria-pressed="true">Bibliothèque</button>
    <button id="tab-mine" aria-pressed="false">Ma liste<b id="mineCount">0</b></button>
  </div>
  <label class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Rechercher un manhwa…" aria-label="Rechercher"></label>
</div></nav>

<main class="gut"><div class="inner">
  <div id="storeNote" class="note" hidden></div>
  <section class="add" aria-labelledby="addTitle">
    <h2 id="addTitle">Ajouter un manhwa</h2>
    <form id="addForm" autocomplete="off"><input id="addUrl" type="url" required placeholder="Colle le lien d'une série ou d'un chapitre (Asura, Vortex ou autre site)" aria-label="Lien du manhwa"><button class="btn" type="submit">Ajouter</button></form>
    <div class="msg" id="addMsg" aria-live="polite"></div>
    <div id="newForm" hidden></div>
  </section>
  <section id="continue" hidden>
    <div class="sechead"><h2>Continuer la lecture</h2></div>
    <div class="rail" id="rail"></div>
  </section>
  <section>
    <div class="sechead">
      <h2 id="listTitle">Toutes les séries</h2>
      <div class="filters">
        <select id="f-type" aria-label="Type"><option value="">Tous types</option><option value="manhwa">Manhwa</option><option value="manhua">Manhua</option></select>
        <select id="f-src" aria-label="Source"><option value="">Toutes sources</option><option value="asura">Asura</option><option value="vortex">Vortex</option></select>
        <select id="f-st" aria-label="Statut"><option value="">Tous statuts</option><option value="ongoing">En cours</option><option value="completed">Terminé</option><option value="hiatus">En pause</option><option value="dropped">Arrêté</option></select>
        <select id="f-sort" aria-label="Tri"><option value="az">A → Z</option><option value="ch">Plus de chapitres</option><option value="rate">Ma note</option><option value="recent">Lus récemment</option><option value="behind">Chapitres à rattraper</option></select>
        <select id="f-rs" aria-label="Statut de lecture" hidden><option value="">Tous mes statuts</option><option value="reading">Je lis</option><option value="plan">À lire</option><option value="restart">Recommencer</option><option value="done">Terminé</option><option value="paused">En pause</option><option value="dropped">Abandonné</option></select>
        <span class="count" id="count"></span>
      </div>
    </div>
    <div class="qnote" id="qnote" hidden></div>
    <div class="grid" id="grid"></div>
    <div id="more"></div>
  </section>
  <footer class="backup">
    <div><strong>Sauvegarde</strong><span class="muted">Ton suivi est stocké sur cet appareil. Exporte-le de temps en temps pour ne rien perdre, ou pour le transférer sur un autre appareil.</span></div>
    <div class="row"><button class="btn sec" type="button" id="bk-export">Exporter mon suivi</button><label class="btn sec" for="bk-import">Importer une sauvegarde</label><input id="bk-import" type="file" accept="application/json,.json" hidden></div>
    <div class="save" id="bk-msg" aria-live="polite"></div>
  </footer>
</div></main>

<div class="overlay" id="ov" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="d-title" id="sheet"></div>
</div>

/* ---------- persistence ---------- */
let local=true;
function loadLocal(){try{progress=JSON.parse(localStorage.getItem("mt-progress")||"{}")}catch(e){progress={}}}
function saveLocal(){try{localStorage.setItem("mt-progress",JSON.stringify(progress))}catch(e){}}
const pending=new Map(); const writing=new Set();
function persist(id){
  const p=progress[id];
  if(local){saveLocal();flash("Enregistré");return;}
  clearTimeout(pending.get(id));
  pending.set(id,setTimeout(()=>write(id),500));
}
async function write(id){
  if(writing.has(id)){persist(id);return;}
  writing.add(id);
  const p=progress[id]; const ref=store.collection("data/users/"+uid).doc(id);
  try{ if(p) await ref.set(p); else await ref.delete(); flash("Enregistré");}
  catch(e){ flash(e&&e.code==="quota_exceeded"?"Stockage plein : retire des séries de ta liste.":"Échec de l'enregistrement, réessaie."); }
  finally{writing.delete(id);}
}
function flash(t){const el=document.querySelector(".save");if(el){el.textContent=t;clearTimeout(flash.t);flash.t=setTimeout(()=>{el.textContent=""},2200);}}

let view="all", shown=0, list=[]; const PAGE=60;
function filtered(){
  const q=$("q").value.trim().toLowerCase(), rs=$("f-rs").value, ty=$("f-type").value, src=$("f-src").value, st=$("f-st").value, so=$("f-sort").value;
  let L=ALL.filter(s=>(view==="all"||(progress[s.id]&&(!rs||(progress[s.id].rs||"reading")===rs)))&&(!q||s.key.includes(q))&&(!ty||s.ty===ty)&&(!src||s.s[src])&&statusFilter(s.st,st));
  const P=id=>progress[id]||{};
  const cmp={az:(a,b)=>a.key.localeCompare(b.key),ch:(a,b)=>b.max-a.max,rate:(a,b)=>(P(b.id).r||0)-(P(a.id).r||0)||a.key.localeCompare(b.key),
    recent:(a,b)=>(P(b.id).at||0)-(P(a.id).at||0)||a.key.localeCompare(b.key),
    behind:(a,b)=>((b.max-(P(b.id).ch||0))*(progress[b.id]?1:0))-((a.max-(P(a.id).ch||0))*(progress[a.id]?1:0))};
  return L.sort(cmp[so]);
}

      <div class="foot"><span class="dot ${s.st}">${ST[s.st]||s.st}</span><span>${s.max?"Ch. "+s.max:""}</span></div></div>
    <div class="ct">${esc(s.t)}</div>
    ${p?`<div class="bar"><i style="width:${pct}%"></i></div><div class="meta"><span>${p.ch?`Lu : ch. ${p.ch}`:RS[p.rs]||"Dans ma liste"}</span><span class="stars">${starsTxt(p.r)}</span></div>`
       :`<div class="meta"><span>${Object.keys(s.s).map(k=>srcName(k)).join(" · ")}</span></div>`}
  </button>`;
}
function renderList(){
  list=filtered(); shown=0; $("grid").innerHTML="";
  const qv=$("q").value.trim(); $("qnote").hidden=!qv;
  if(qv){$("qnote").innerHTML=`<span>Recherche active : « ${esc(qv)} »${view==="mine"?` · ${list.length} sur ${Object.keys(progress).length} séries de ta liste`:""}</span><button type="button" id="qclear">Effacer la recherche</button>`;}
  $("count").textContent=`${list.length} série${list.length>1?"s":""}`;
  $("listTitle").textContent=view==="all"?"Toutes les séries":"Ma liste";
  if(!list.length){$("grid").innerHTML=`<div class="empty">${view==="mine"?"Ta liste est vide. Ouvre une série dans la Bibliothèque et indique ton chapitre ou une note pour l'ajouter.":"Aucune série ne correspond à ces filtres."}</div>`;return;}
  more();
}
function more(){ if(shown>=list.length)return; $("grid").insertAdjacentHTML("beforeend",list.slice(shown,shown+PAGE).map(cardHTML).join("")); shown+=PAGE; }
new IntersectionObserver(e=>{if(e[0].isIntersecting)more();},{rootMargin:"600px"}).observe($("more"));

function renderRail(){
  const L=ALL.filter(s=>{const p=progress[s.id];return p&&p.ch&&(p.rs||"reading")==="reading";}).sort((a,b)=>(progress[b.id].at||0)-(progress[a.id].at||0)).slice(0,12);
  $("continue").hidden=!L.length;
  $("rail").innerHTML=L.map(s=>{const p=progress[s.id];const n=(p.ch||0)+1;const left=s.max?s.max-(p.ch||0):1;
    return `<div class="rcard">${imgHTML(s)}<div class="rb"><button class="link-btn" style="text-decoration:none;color:var(--fg);text-align:left" data-id="${s.id}"><span class="rt">${esc(s.t)}</span></button>
      <span class="muted" style="font-size:.78rem">Ch. ${p.ch}${s.max?` / ${s.max}${left>0?` · ${left} à lire`:" · à jour"}`:""}</span>
      <div class="bar"><i style="width:${s.max?Math.min(100,p.ch/s.max*100):0}%"></i></div>
      <a class="go" href="${nextLink(s,left>0?n:p.ch)}" target="_blank" rel="noopener">▶ ${canDeep(s)?(left>0?"Chapitre "+n:"Relire ch. "+p.ch):"Ouvrir la série"}</a></div></div>`;}).join("");
}
function renderAll(){ rebuild(); $("mineCount").textContent=Object.keys(progress).length; renderRail(); renderList(); }

/* ---------- detail ---------- */
let openId=null, lastFocus=null;
function openSheet(id){ openId=id; lastFocus=document.activeElement; refreshSheet(); $("ov").hidden=false; document.body.style.overflow="hidden"; $("sheet").querySelector(".close").focus(); }
function closeSheet(){ openId=null; $("ov").hidden=true; document.body.style.overflow=""; if(lastFocus)lastFocus.focus(); }
function refreshSheet(){
  const s=byId.get(openId); const p=progress[openId]||{}; const r=p.r||0;
  const active=document.activeElement&&document.activeElement.id==="d-ch";
  let starBtns="";for(let i=1;i<=5;i++){const cls=r>=i*2?"on":(r===i*2-1?"half":"");starBtns+=`<button data-star="${i}" class="${cls}" aria-label="${i} étoile${i>1?"s":""}">★</button>`;}
  $("sheet").innerHTML=`<button class="close" aria-label="Fermer">✕</button>
  <div class="hero"><div class="bg" style="${coverOf(s)?`background-image:url(${coverOf(s)})`:""}"></div>
    <div class="big">${imgHTML(s)}</div>
    <div class="info">
      <div class="tags"><span class="tag t${s.ty==="manhua"?" hua":""}">${s.ty}</span>${(s.g||[]).map(g=>`<span class="tag">${esc(g)}</span>`).join("")}</div>
      <h3 id="d-title">${esc(s.t)}</h3>
      <div class="srcs">${Object.entries(s.s).map(([k,v])=>`<div class="src"><strong>${srcName(k)}</strong><div class="grow"><span class="dot ${v.st}">${ST[v.st]||v.st}</span>${s.custom?`<label style="display:flex;align-items:center;gap:6px">Chapitres dispo <input class="mini" id="d-max" type="number" min="0" value="${v.ch||""}" placeholder="?"></label>`:`<span>${v.ch??"?"} chapitres</span>`}</div><a class="ghost" href="${v.u}" target="_blank" rel="noopener">Ouvrir sur ${srcName(k)} ↗</a></div>`).join("")}</div>
    </div></div>
  <div class="track">
    <div class="box"><label for="d-ch">Chapitre où j'en suis</label>
      <div class="stepper"><button data-step="-1" aria-label="Chapitre précédent">−</button><input id="d-ch" type="number" min="0" inputmode="numeric" value="${p.ch||0}"><button data-step="1" aria-label="Chapitre suivant">+</button><span class="of">/ ${s.max||"?"}</span></div>
      <div class="bar"><i style="width:${s.max?Math.min(100,(p.ch||0)/s.max*100):0}%"></i></div>
      <a class="go" href="${nextLink(s,Math.max(1,(p.ch||0)+(p.ch&&s.max&&p.ch>=s.max?0:1)))}" target="_blank" rel="noopener">▶ ${!canDeep(s)?"Ouvrir la série":p.ch?(s.max&&p.ch>=s.max?"Relire le chapitre "+p.ch:"Lire le chapitre "+(p.ch+1)):"Commencer au chapitre 1"}</a>
    </div>
    <div class="box"><span class="lbl">Ma note</span>
      <div class="rate">${starBtns}<span class="val">${r?(r/2).toString().replace(".",",")+" / 5":"–"}</span></div>
      <span class="muted" style="font-size:.78rem">Clique sur la moitié gauche d'une étoile pour une demi-note.</span>
    </div>
    <div class="box"><label for="d-rs">Statut de lecture</label>
      <select id="d-rs">${s.custom?"":`<option value="">Pas dans ma liste</option>`}${Object.entries(RS).map(([k,v])=>`<option value="${k}" ${progress[openId]&&(p.rs||"reading")===k?"selected":""}>${v}</option>`).join("")}</select>
      <div class="row">${s.custom?`<button class="link-btn" id="d-rm">Supprimer cette série</button>`:progress[openId]?`<button class="link-btn" id="d-rm">Retirer de ma liste</button>`:""}</div>
      <div class="save" aria-live="polite"></div>
    </div>
  </div>`;
  if(active){const i=$("d-ch");i.focus();i.setSelectionRange&&0;}
}
function update(fn){
  const id=openId; const p={...(progress[id]||{rs:"reading"})}; fn(p); p.at=Date.now();
  progress[id]=p; renderAll(); refreshSheet(); persist(id);
}
$("sheet").addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t)return;
  if(t.classList.contains("close"))return closeSheet();
  if(t.dataset.step){const s=byId.get(openId);update(p=>{p.ch=Math.max(0,(p.ch||0)+Number(t.dataset.step));});return;}
  if(t.dataset.star){const i=+t.dataset.star;const rect=t.getBoundingClientRect();const half=e.clientX&&(e.clientX-rect.left)<rect.width/2;let v=half?i*2-1:i*2;update(p=>{p.r=(p.r===v)?0:v;});return;}
  if(t.id==="d-rm"){const id=openId,cust=byId.get(id).custom;delete progress[id];renderAll();if(cust)closeSheet();else refreshSheet();persist(id);}
});
$("sheet").addEventListener("change",e=>{
  if(e.target.id==="d-ch"){const v=Math.max(0,parseInt(e.target.value,10)||0);update(p=>{p.ch=v;});}
  if(e.target.id==="d-max"){const v=Math.max(0,parseInt(e.target.value,10)||0);update(p=>{p.custom={...p.custom,ch:v||null};});}
  if(e.target.id==="d-rs"){const v=e.target.value;if(!v){const id=openId;delete progress[id];renderAll();refreshSheet();persist(id);}else update(p=>{p.rs=v;});}
});
$("ov").addEventListener("click",e=>{if(e.target.id==="ov")closeSheet();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&openId)closeSheet();});
document.addEventListener("click",e=>{const c=e.target.closest("[data-id]");if(c&&!c.closest("#sheet"))openSheet(c.dataset.id);});

/* ---------- controls ---------- */
function setView(v){view=v;$("f-rs").hidden=v!=="mine";if(v!=="mine")$("f-rs").value="";$("tab-all").setAttribute("aria-pressed",v==="all");$("tab-mine").setAttribute("aria-pressed",v==="mine");if(v==="mine"&&$("f-sort").value==="az")$("f-sort").value="recent";renderList();}
$("tab-all").onclick=()=>setView("all"); $("tab-mine").onclick=()=>setView("mine");
let qt; $("q").addEventListener("input",()=>{clearTimeout(qt);qt=setTimeout(renderList,120);});
document.addEventListener("click",e=>{if(e.target.id==="qclear"){$("q").value="";renderList();$("q").focus();}});
["f-type","f-src","f-st","f-sort","f-rs"].forEach(id=>$(id).addEventListener("change",renderList));

/* ---------- add by link ---------- */
const nrm=u=>{try{u=decodeURI(u)}catch(e){} return u.toLowerCase().replace(/^https?:\/\/(www\.)?/,"").replace(/[#?].*$/,"").replace(/\/+$/,"");};
function parseLink(raw){
  let url; try{url=new URL(raw.trim());}catch(e){return null;}
  if(!/^https?:$/.test(url.protocol))return null;
  const host=url.hostname.replace(/^www\./,"");
  let path; try{path=decodeURIComponent(url.pathname)}catch(e){path=url.pathname}
  path=path.replace(/\/+$/,"");
  let ch=null, m;
  if((m=path.match(/\/chapter[\/-](\d+(?:\.\d+)?)$/i))||(m=path.match(/\/(?:chapitre|ch|episode|ep)[\/-]?(\d+(?:\.\d+)?)$/i))){ch=Math.floor(parseFloat(m[1]));path=path.slice(0,m.index);}
  const base=url.origin+path;
  const src=host.includes("asurascans")?"asura":host.includes("vortexscans")?"vortex":(host.split(".").slice(-2,-1)[0]||host);
  let slug=path.split("/").filter(Boolean).pop()||host;
  slug=slug.replace(/-[0-9a-f]{8}$/i,"").replace(/\.html?$/,"").replace(/^\d+-/,"");
  const title=slug.replace(/[-_]+/g," ").replace(/\s+/g," ").trim().replace(/(^|\s)(\S)/g,(a,b,c)=>b+c.toUpperCase());
  return {src,host,base,ch,title};
}
function findExisting(info){
  const b=nrm(info.base), k=info.title.toLowerCase().replace(/[^a-z0-9]/g,"");
  return ALL.find(s=>Object.values(s.s).some(v=>nrm(v.u)===b))||ALL.find(s=>s.key.replace(/[^a-z0-9]/g,"")===k);
}
function addMsg(t,err){const m=$("addMsg");m.textContent=t;m.classList.toggle("err",!!err);}
let draft=null;
$("addForm").addEventListener("submit",e=>{
  e.preventDefault(); const info=parseLink($("addUrl").value);
  if(!info){addMsg("Ce lien n'est pas valide. Copie l'adresse complète de la page, en commençant par https://",true);return;}
  const ex=findExisting(info);
  if(ex){
    const p={...(progress[ex.id]||{rs:"reading"})}; if(info.ch)p.ch=info.ch; p.at=Date.now();
    progress[ex.id]=p; renderAll(); persist(ex.id);
    addMsg(`« ${ex.t} » est déjà dans le catalogue : ajouté à ta liste${info.ch?`, au chapitre ${info.ch}`:""}.`);
    $("addUrl").value=""; $("newForm").hidden=true; draft=null; openSheet(ex.id); return;
  }
  draft={...info,img:null}; addMsg(`Nouvelle série détectée sur ${info.host}. Vérifie les infos puis valide.`); showDraft();
});
function showDraft(keep){
  const d=draft, f=$("newForm"); f.hidden=false;
  f.innerHTML=`<form class="newf" id="draftForm">
    <label class="pv" for="n-img">${d.img?`<img src="${d.img}" alt="">`:"Ajouter une couverture<br>(facultatif)"}</label>
    <div class="fields">
      <label class="wide">Titre<input id="n-t" required value="${esc(d.title)}"></label>
      <label>Type<select id="n-ty"><option value="manhwa">Manhwa</option><option value="manhua">Manhua</option><option value="manga">Manga</option></select></label>
      <label>Statut<select id="n-st"><option value="ongoing">En cours</option><option value="completed">Terminé</option><option value="hiatus">En pause</option><option value="dropped">Abandonné</option></select></label>
      <label>Chapitres dispo<input id="n-ch" type="number" min="0" placeholder="?"></label>
      <label>Je suis au chapitre<input id="n-me" type="number" min="0" value="${d.ch||""}" placeholder="0"></label>
      <input id="n-img" type="file" accept="image/*" hidden>
      <div class="acts"><button class="btn" type="submit">Ajouter à ma liste</button><button class="btn sec" type="button" id="n-cancel">Annuler</button></div>
    </div></form>`;
  if(keep){for(const k in keep)$(k).value=keep[k];}
  $("n-t").focus();
}
$("newForm").addEventListener("change",async e=>{
  if(e.target.id!=="n-img"||!e.target.files[0])return;
  const keep={"n-t":$("n-t").value,"n-ty":$("n-ty").value,"n-st":$("n-st").value,"n-ch":$("n-ch").value,"n-me":$("n-me").value};
  try{draft.img=await thumb(e.target.files[0]);}catch(err){addMsg("Impossible de lire cette image. Essaie un fichier JPG, PNG ou WebP.",true);return;}
  showDraft(keep);
});
$("newForm").addEventListener("click",e=>{if(e.target.id==="n-cancel"){$("newForm").hidden=true;draft=null;addMsg("");}});
$("newForm").addEventListener("submit",e=>{
  e.preventDefault(); const d=draft; if(!d)return;
  const id="c-"+Date.now().toString(36);
  const ch=parseInt($("n-ch").value,10)||null, me=parseInt($("n-me").value,10)||0;
  progress[id]={rs:"reading",ch:me,at:Date.now(),custom:{t:$("n-t").value.trim()||d.title,ty:$("n-ty").value,st:$("n-st").value,ch,u:d.base,src:d.src,img:d.img}};
  renderAll(); persist(id); $("newForm").hidden=true; $("addUrl").value=""; draft=null;
  addMsg(`« ${progress[id].custom.t} » ajouté à ta liste.`); openSheet(id);
});
async function thumb(file){
  const bm=await createImageBitmap(file); const W=200,H=284; const c=document.createElement("canvas"); c.width=W;c.height=H;
  const s=Math.max(W/bm.width,H/bm.height),w=bm.width*s,h=bm.height*s; c.getContext("2d").drawImage(bm,(W-w)/2,(H-h)/2,w,h);
  return c.toDataURL("image/webp",.75);
}

/* ---------- backup ---------- */
$("bk-export").addEventListener("click",async()=>{
  const data=JSON.stringify({app:"manhwa-tracker",v:1,date:new Date().toISOString(),progress},null,1);
  const name=`manhwa-tracker-${new Date().toISOString().slice(0,10)}.json`;
  const file=new File([data],name,{type:"application/json"});
  try{ if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"Sauvegarde Manhwa Tracker"});$("bk-msg").textContent="Sauvegarde prête.";return;} }catch(e){ if(e.name==="AbortError")return; }
  const a=document.createElement("a"); a.href=URL.createObjectURL(file); a.download=name; document.body.appendChild(a); a.click(); a.remove();
  $("bk-msg").textContent="Sauvegarde téléchargée.";
});
$("bk-import").addEventListener("change",async e=>{
  const f=e.target.files[0]; if(!f)return;
  try{ const j=JSON.parse(await f.text()); if(!j||typeof j.progress!=="object")throw 0;
    progress={...progress,...j.progress}; saveLocal(); renderAll(); $("bk-msg").textContent=`${Object.keys(j.progress).length} séries importées.`;
  }catch(err){ $("bk-msg").textContent="Ce fichier n'est pas une sauvegarde Manhwa Tracker valide."; }
  e.target.value="";
});
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});

initStore(); loadCovers();
</script>
